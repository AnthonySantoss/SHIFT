version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shift-backend
    ports:
      - "3333:3333"
    environment:
      - PORT=3333
      - NODE_ENV=production
    volumes:
      - sqlite-data:/app/src/database
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shift-frontend
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=development
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=192.168.0.24
    command: npx expo start --lan
    volumes:
      - /app/node_modules
      - ./frontend:/app
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  sqlite-data:
    driver: local
